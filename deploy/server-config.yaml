AppConfig:
  name: taskd
  addr: 127.0.0.1:8080
  env: dev
LogLevel: 0
Datasource:
  dialect: mysql
  host: 127.0.0.1
  port: 3306
  username: root
  password: root
  database: test
  debug: true
Scheduler:
  ScanInterval: 1s
  LookaheadWindow: 5s
  BatchSize: 100
  LeaseDuration: 30s
  WorkerConcurrency: 8
  InstanceID: ""
  TickInterval: 100ms
  SlotsPerLevel: 256
  MaxLevels: 4
