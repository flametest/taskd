AppConfig:
  name: taskd
  addr: 127.0.0.1:8080
  env: dev
LogLevel: 0
Datasource:
  dialect: postgres
  host: 127.0.0.1
  port: 5432
  username: cos
  password: cos
  database: taskd
  schema: public
  debug: false
Scheduler:
  ScanInterval: 1s
  LookaheadWindow: 5s
  BatchSize: 100
  LeaseDuration: 30s
  WorkerConcurrency: 8
  InstanceID: ""
  TickInterval: 100ms
  SlotsPerLevel: 256
  MaxLevels: 4
  HTTPTimeout: 10s
  GrpcTimeout: 10s
  BackoffBase: 1s
  BackoffMaxInterval: 5m
  ReaperInterval: 5s
